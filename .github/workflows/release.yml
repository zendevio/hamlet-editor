name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag and determine release metadata
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/release-version.mjs

      - name: Verify curated release notes
        env:
          TAG: ${{ github.ref_name }}
        run: test -s ".github/release-notes/${TAG}.md"

      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          tag_name: ${{ github.ref_name }}

  build:
    name: Build release installers
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ needs.create-release.outputs.release_id }}

  dry-run:
    name: Build test installers
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  # Releases stay as drafts until the downloaded installers have been tested.
