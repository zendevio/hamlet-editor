name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Catalog and generated-type checks
        run: pnpm i18n:check

      - name: Svelte check
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Frontend tests
        run: pnpm test

      - name: Upload translation readiness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: translation-readiness
          path: test-results/i18n-readiness.json
          if-no-files-found: warn

  mounted-i18n:
    # The full suite needs about 90 minutes on one runner, so it runs in four shards.
    name: Mounted i18n invariants (${{ matrix.shard }}/4)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check catalogs and generated types
        run: pnpm i18n:check

      - name: Type-check mounted tests and Playwright config
        run: pnpm exec tsc --noEmit -p tests/e2e/tsconfig.json

      - name: Install Chromium and WebKit from pinned Playwright
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Mounted invariants in Chromium and WebKit
        run: pnpm test:h1 --shard=${{ matrix.shard }}/4
        env:
          H1_OUTPUT_DIR: test-results/h1

      - name: Upload mounted i18n evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mounted-i18n-evidence-${{ matrix.shard }}
          retention-days: 14
          path: test-results/h1
          if-no-files-found: warn

  overflow-summary:
    # Summarise every shard's overflow reports together, so the baseline sees the whole run.
    name: Overflow summary
    needs: mounted-i18n
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mounted-i18n-evidence-*
          path: test-results/h1
          merge-multiple: true

      - name: Summarise overflow findings against the reviewed baseline
        run: node scripts/overflow-baseline.mjs test-results/h1

      # A failed or missing shard leaves the reports incomplete, so this summary cannot pass.
      - name: Require every shard to have passed
        if: always() && needs.mounted-i18n.result != 'success'
        env:
          RESULT: ${{ needs.mounted-i18n.result }}
        run: |
          echo "::error::Mounted i18n shards did not all pass (result: $RESULT); the overflow summary covers an incomplete run"
          exit 1

  rust:
    name: Rust checks
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (2026-09-03)
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Check formatting
        run: cargo fmt --check

      - name: Save codec formatting
        run: cargo fmt --check --manifest-path crates/ddsavelib/Cargo.toml

      - name: Save codec Clippy
        run: cargo clippy --locked -p ddsavelib --all-targets --all-features -- -D warnings

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      - name: Save codec tests
        run: cargo test -p ddsavelib
