name: Nexus Mods

# Publishing a GitHub release uploads its installers to the Nexus Mods page as
# new versions of the existing Windows, macOS and Linux files.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (for example v1.0.1)
        required: true
      dry_run:
        description: Build the zips without uploading
        type: boolean
        default: true

permissions: {}

concurrency:
  group: nexus-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    name: Upload to Nexus Mods
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      HAS_KEY: ${{ secrets.NEXUSMODS_API_KEY != '' }}
    steps:
      - name: Check configuration
        id: config
        run: |
          missing=""
          [ "$HAS_KEY" = "true" ] || missing="$missing NEXUSMODS_API_KEY(secret)"
          for v in NEXUS_MOD_ID NEXUS_FILE_ID_WINDOWS NEXUS_FILE_ID_MACOS NEXUS_FILE_ID_LINUX; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Nexus upload skipped, missing:$missing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) echo "version=${TAG#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected tag '$TAG'"; exit 1 ;;
          esac
        env:
          NEXUS_MOD_ID: ${{ vars.NEXUS_MOD_ID }}
          NEXUS_FILE_ID_WINDOWS: ${{ vars.NEXUS_FILE_ID_WINDOWS }}
          NEXUS_FILE_ID_MACOS: ${{ vars.NEXUS_FILE_ID_MACOS }}
          NEXUS_FILE_ID_LINUX: ${{ vars.NEXUS_FILE_ID_LINUX }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.skip != 'true'
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          sparse-checkout: .github/release-notes

      - name: Download installers and build zips
        if: steps.config.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          mkdir dl
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dl \
            -p '*.exe' -p '*.msi' -p '*.dmg' -p '*.AppImage' -p '*.deb' -p '*.rpm'
          ls -l dl
          zip -j "HamletEditor-$VERSION-Windows.zip" dl/*.exe dl/*.msi
          zip -j "HamletEditor-$VERSION-macOS.zip" dl/*.dmg
          zip -j "HamletEditor-$VERSION-Linux.zip" dl/*.AppImage dl/*.deb dl/*.rpm
          ls -l HamletEditor-*.zip
          # Nexus changelogs take one line per entry: use the bullet points of the curated notes.
          notes=".github/release-notes/$TAG.md"
          {
            echo 'changelog<<NEXUS_EOF'
            if [ -f "$notes" ]; then grep -E '^- ' "$notes" | sed 's/^- //'; else echo "Release $TAG."; fi
            echo 'NEXUS_EOF'
          } >> "$GITHUB_ENV"

      - name: Upload Windows
        if: steps.config.outputs.skip != 'true' && env.DRY_RUN != 'true'
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          file_id: ${{ vars.NEXUS_FILE_ID_WINDOWS }}
          filename: HamletEditor-${{ steps.config.outputs.version }}-Windows.zip
          version: ${{ steps.config.outputs.version }}
          display_name: Hamlet Editor for Windows
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: false
          update_mod_version: true
          changelog: ${{ env.changelog }}

      - name: Upload macOS
        if: steps.config.outputs.skip != 'true' && env.DRY_RUN != 'true'
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID_MACOS }}
          filename: HamletEditor-${{ steps.config.outputs.version }}-macOS.zip
          version: ${{ steps.config.outputs.version }}
          display_name: Hamlet Editor for macOS
          archive_existing_version: true
          allow_mod_manager_download: false

      - name: Upload Linux
        if: steps.config.outputs.skip != 'true' && env.DRY_RUN != 'true'
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID_LINUX }}
          filename: HamletEditor-${{ steps.config.outputs.version }}-Linux.zip
          version: ${{ steps.config.outputs.version }}
          display_name: Hamlet Editor for Linux
          archive_existing_version: true
          allow_mod_manager_download: false
