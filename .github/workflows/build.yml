name: Build installers

on:
  workflow_call:
    inputs:
      release-id:
        description: Draft release ID; empty builds workflow artifacts only
        type: string
        default: ""

# Permissions are bounded by the caller: read for dry runs, write for uploads.
jobs:
  build:
    name: Build (${{ matrix.label }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            runner: ubuntu-22.04
            args: ""
          - label: macos
            runner: macos-26
            args: --target universal-apple-darwin
          - label: windows
            runner: windows-2025
            args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (2026-09-03)
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.label == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ./src-tauri -> target

      - name: Install system dependencies (Linux)
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ inputs.release-id != '' && secrets.GITHUB_TOKEN || '' }}
        with:
          releaseId: ${{ inputs.release-id }}
          args: ${{ matrix.args }}
          releaseAssetNamePattern: hamlet-editor_[version]_[platform]_[arch][setup][ext]
          uploadWorkflowArtifacts: ${{ inputs.release-id == '' }}
