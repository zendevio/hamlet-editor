[package]
name = "ddsavelib"
version = "0.2.0"
description = "Library for reading/writing Darkest Dungeon save files. Originally by robojumper."
authors = ["robojumper <robojumper@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = ["string_cache"]

[dependencies]
thiserror = "2"
byteorder = "1.3.4"
itoa = "1"
ryu = "1"
serde = { version = "1", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
string_cache = { version = "0.8.1", default-features = false, optional = true }
