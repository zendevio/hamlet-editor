[workspace]
members = ["crates/ddsavelib"]
default-members = ["."]
resolver = "2"

[package]
name = "hamlet-editor"
version = "1.0.0"
description = "Darkest Dungeon save game editor"
authors = ["Alin M. Gheorghe"]
license = "MIT"
repository = "https://github.com/zendevio/hamlet-editor"
homepage = "https://github.com/zendevio/hamlet-editor"
edition = "2021"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hamlet_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
ddsavelib = { path = "crates/ddsavelib" }
steamlocate = "2"
sysinfo = "0.39"
dirs = "7"
regex = "1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
