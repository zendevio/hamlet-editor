[package]
name = "hamlet-editor"
version = "0.1.0"
description = "Darkest Dungeon save game editor"
authors = ["Alin Gheorghe"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hamlet_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
ddsavelib = { path = "crates/ddsavelib" }
steamlocate = "2"
sysinfo = "0.33"
dirs = "6"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
